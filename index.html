<script type="text/markdown" id="md-tz"># Карта рынка HERZEN: ТЗ для CTO

Срез на 26.11.2026

## Бриф для CTO

За 4–6 недель строим карту, которая показывает, какая доля индустриальной недвижимости Москвы и области уже в нашей базе и что именно не закрыто. Дальше люди и ИИ перекрашивают серое в зелёное.

|  |  |
| --- | --- |
| Final Point | Реестр всей индустриальной недвижимости региона: где, что, фото, характеристики, собственник, контакт в CRM, арендаторы. У каждого поля — источник и дата, видно, чего не знаем |
| MVP | Участки и здания промназначения из кадастра и OSM, объекты HerzenCRM с границами из участков, окраска «знаем / не знаем», счётчик покрытия по площади зданий, очереди серых участков и разметки границ |
| Пользователи | Все сотрудники по рабочей учётке: брокеры и аналитики. Одна роль, журнал правок |
| Кто ведёт | Команда CTO, свой репозиторий. HerzenCRM только читаем через снимки |
| Стек | PostgreSQL с PostGIS, Martin, MapLibre, Python, QGIS для аналитиков |

Пять правил, на которых держится система:

1. У участка, здания и комплекса свой постоянный номер. Кадастровый — внешний ключ с историей.
2. Храним факты с источником и датой, а не поля. Неизвестное — пусто, не ноль.
3. Автоматика даёт кандидата, подтверждает человек или документ. Зелёным красит только подтверждённое.
4. Источник — адаптер с одним контрактом. Любая деталь меняется, как лего.
5. Данные Яндекса не сохраняем, защиту площадок не обходим, контакты людей из CRM на карту не выносим.

Первые две недели: срез на одном округе от кадастра до окрашенной карты, затем карта с паспортом и разметкой границ на этом округе. Задачи, схема базы и правила для ИИ-агентов — во вкладке [Стартовый набор](#starter). Подробности пилота — во вкладке [Приложение: пилот](#appendix).

До старта нужны три ответа: как в CRM отличить объект с занесённым собственником и контактом (ответственный за HerzenCRM), машина и выход в сеть к госсистемам (команда CTO с администратором сети), можно ли долго хранить слои НСПД (CTO).

Как это выглядит, показано в [визуальном приложении](map/): макет экрана на реальной подложке района у шоссе Энтузиастов, разметка границ, слои, схема и этапы.

## Суть

Строим карту, на которой каждый индустриальный участок и каждое здание Москвы и области имеет паспорт и цвет: зелёный — знаем собственника и объект занесён в базу, серый — не знаем. Цель работы аналитиков и ИИ — перекрасить серое в зелёное.

**Главный принцип.** Ядро — не карта, а реестр фактов с привязкой к кадастровому номеру. Карта — одно из окон в этот реестр. Паспорт объекта, списки и выгрузка в CRM — другие окна.

## Что уже есть

Карта — самостоятельный продукт команды CTO. Ниже — что компания уже пробовала в прототипах. Это образцы и проверенные правила, а не код, на который карта опирается.

| Что есть у компании | Что даёт карте |
| --- | --- |
| Снимки HerzenCRM через HerzenStats: объекты, корпуса и блоки с точками | Источник «зелёного» и черновиков границ. CRM не перебираем, читаем снимок |
| Снимок объявлений площадок в HerzenCRM | Слой «что сейчас в рынке» |
| Пилот обогащения: коллектор НСПД и эталон из 30 карточек | Задел адаптера кадастра и тесты приёмки |
| Прототип сверки объявлений с CRM: адрес, расстояние, название комплекса, фото | Образец сопоставления: правила и пороги переносятся, код пишется заново. Новый метод — точка внутри участка |

Чего нет: геометрии участков и зданий (сейчас только точки), геобазы (сейчас SQLite и JSON), понятия «объект, которого нет в CRM». Именно это и добавляет проект.

В октябре 2026 исследовательский пилот в Codex прошёл путь «карточка CRM → участок → зона → разрешённое использование» на 30 карточках. Его коллектор НСПД — задел адаптера, карточки — эталон для тестов. Подробно — Приложение: пилот.

## Что мы уже знаем

Уроки прототипов и пилота, которые меняют проектирование.

- **Точке объекта в CRM верить нельзя.** В пилоте точка объекта в Ерино легла на чужой участок в 191 м от верного. Точные координаты есть только у корпусов и блоков, кадастровых номеров в CRM нет.
- **Автоматика даёт красивую, но ложную карту.** Из 30 карточек конкретная земля установлена для 13, ещё 9 — только до общей площадки. Поэтому разметка людьми — часть продукта, а не временная мера.
- **Госсистемы доступны плохо.** НСПД отвечал только через российский выход в сеть, примерно запрос в секунду. РГИС Московской области и ГИСОГД Москвы не ответили.
- **Площадки закрываются.** ЦИАН с 20.11.2026 не отдаёт страницы серверу. Объявления берём из снимка в CRM, а не парсингом.
- **CRM не перебираем.** На обход она отвечает 429 и мешает коллегам. Читаем ночной снимок.
- **Размечают разные люди в разных процессах.** Интерфейс должен быть понятен брокеру без обучения.

Как мы работаем и чего ждём от команды:

- KISS: на каждом этапе один вопрос бизнеса и один счётчик. Свой ГИС-редактор не пишем, сложное — в QGIS.
- Всё чужое записано в реестре деталей: что взяли, зачем и чем заменить.
- Сеть, VPN и доступы — только тикетом администратору. Обходных путей не ищем.
- Сбой, после которого чинили, записываем и выводим из него правило.
- Пишем код с ИИ-агентами по правилам из стартового набора: сначала тест на эталоне, потом код.

## Главные решения

Девять решений задают всю архитектуру. Схема — в визуальном приложении к ТЗ.

1. **Якорь — свой номер объекта, кадастровый номер — внешний ключ.** У участка, здания и комплекса свой постоянный внутренний номер. Кадастровый номер хранится как внешний ключ с историей: он меняется при разделе и объединении, а у строящегося корпуса его ещё нет. Адрес, название и точка — способы найти кандидата, а не подтверждение.
2. **Маску Яндекса как данные не берём.** Условия API Яндекс Карт запрещают сохранять полученные данные в свою базу. Серое на Яндексе — это то же промназначение земли, и оно есть в открытых источниках: вид разрешённого использования и категория земель в кадастре (НСПД) плюс `landuse=industrial` в OpenStreetMap. Яндекс и спутник остаются подложкой для глаз.
3. **Храним факты, а не поля.** Каждое значение («площадь 12 000 м²», «собственник ООО …») лежит отдельной строкой со своим источником и датой. Паспорт объекта собирается из фактов по приоритету источников. Отсюда бесплатно получаются «знаем, что не знаем», свежесть и спор источников.
4. **Источник — это адаптер с одним контрактом.** Адаптер отдаёт записи: внешний номер, геометрия или адрес, поля, ссылка, дата. Он ничего не знает о карте. Сопоставление записи с объектом делает общий модуль. Источник меняется или отключается, как деталь лего.
5. **Комплекс — отдельная сущность.** Складской комплекс часто стоит на нескольких участках, а на одном участке бывает несколько зданий разных владельцев. Предложение из CRM, корпус, здание в кадастре, участок и комплекс — пять разных сущностей со связями «многие ко многим». Связь хранит охват: конкретный корпус, общий участок, площадка целиком или часть участка.
6. **CRM остаётся хозяином контактов и сделок.** Карта читает ночной снимок и показывает факт «контакт есть» и ссылку на карточку. Телефонов, почт и имён на карте нет. В CRM пишет только человек.
7. **Скучный стек.** PostGIS, готовый сервер векторных плиток, MapLibre. Аналитик с первого дня работает в бесплатном QGIS, подключённом к той же базе. Своего ГИС-редактора не пишем.
8. **Автоматика даёт кандидата, подтверждает документ или человек.** Точка внутри участка, совпавший адрес, близкая площадь — это кандидаты. Координаты в CRM относятся к комплексу, а не к корпусу: в пилоте точка объекта в Ерино легла примерно в 191 м от верного участка, на чужую землю. Карту красит только подтверждённая связь.
9. **Точность, полнота, охват, актуальность и доступность источника — отдельные признаки.** Одной общей «уверенности» нет. Неизвестное хранится как пусто, а не как ноль. Ошибка доступа к источнику — не «объект не найден». Свежая дата записи в API не доказывает, что учтена последняя редакция документа.

## Границы объекта

Границу объекта не рисуют от руки, а собирают из кадастровых участков: система предлагает черновик, человек кликом добавляет или убирает участки и подтверждает. Из подтверждённой границы получается полный список кадастровых номеров объекта.

Исходные данные (руководитель, 26.11.2026): в HerzenCRM корректные координаты есть у блоков и корпусов. У объекта — одна точка где-то внутри, границ она не даёт. Кадастровых номеров в базе нет.

Как собирается граница:

1. **Черновик по корпусам.** Берём точки корпусов и блоков объекта. Участки, в которые они попали, — ядро черновика. Точка самого объекта в расчёте не участвует.
2. **Соседи-кандидаты.** Смежные участки с тем же видом использования и адресом система показывает пунктиром: парковка, проезды, запас земли. После этапа «Собственники» сюда добавится признак «тот же собственник».
3. **Подтверждение человеком.** На карте клик по участку включает его в объект или исключает. Подложка — спутник, чтобы видеть забор и проезды. Кнопка «Граница верна» записывает, кто и когда подтвердил.
4. **Результат.** Контур объекта — объединение подтверждённых участков. Список кадастров — эти участки плюс все здания и сооружения из кадастра, лежащие внутри контура, с площадями.
5. **Возврат в CRM.** Список кадастровых номеров выгружается по объекту. Как он попадает в карточку CRM — вопрос к ответственному за HerzenCRM: нужно поле и способ загрузки. Карта в CRM сама не пишет.

**Кто подтверждает** (руководитель, 26.11.2026). Роль не закрепляем: подтвердить границу может любой сотрудник, в разных процессах это будут разные люди. Система записывает, кто и когда подтвердил, и позволяет другому человеку исправить с сохранением истории. Разметить нужно все объекты базы, без этого карта не работает. Поэтому разметка встроена в три места: общая очередь по убыванию площади, кнопка в паспорте любого объекта без границы и счётчик «размечено N из M объектов» рядом со счётчиком покрытия.

В данных новых таблиц не нужно. Состав границы — это связи `link` между `site` и `parcel` со статусом «кандидат» или «подтверждена». У `site` добавляются геометрия границы и её статус: черновик, подтверждена, проверить.

Особые случаи:

| Случай | Что делаем |
| --- | --- |
| Точка корпуса не попала ни в один участок | Задача проверки. Если участка нет в кадастре, контур рисуется от руки с пометкой «нет в кадастре» |
| Один участок занимают два объекта CRM | Участок входит в оба с охватом «общий участок». Площадь зданий делится по корпусам |
| Объект занимает часть большого участка | Охват «часть участка». В покрытие идут только здания объекта, а не весь участок |
| Участок без зданий: парковка, запас земли | В черновик не попадает сам, только кандидатом-соседом или вручную |
| Кадастр изменился: участок разделили или объединили | Граница получает статус «проверить», подтверждение не переносится автоматически |

Что это меняет в MVP:

- В состав MVP входит режим «граница объекта» на веб-карте. Это единственная правка данных на карте в первой версии; всё остальное — в QGIS.
- Зелёным красится только участок из подтверждённой границы. Черновик показан зелёным контуром без заливки и в счётчик покрытия не идёт.
- Очередь на подтверждение отсортирована по площади объекта: сначала крупные комплексы.
- Новый критерий приёмки: у каждого объекта CRM с корпусами есть черновик границы или задача проверки с причиной; на районе вертикального среза все границы подтверждены человеком.

Не проверено: у какой доли корпусов точка реально стоит на здании. Это покажет вертикальный срез.

## Модель данных

Десять таблиц. Новый источник добавляет строки, а не столбцы и не таблицы.

| Таблица | Что хранит | Ключевые поля |
| --- | --- | --- |
| `parcel` | Земельный участок из кадастра | внутренний номер, кадастровый номер с историей, геометрия с версией, категория земель, вид использования, площадь, признак «промназначение» |
| `building` | Здание: из кадастра или контур OSM | внутренний номер, кадастровый номер или номер OSM, геометрия, площадь пятна и кадастровая площадь отдельно, этажность |
| `site` | Комплекс, как его знает рынок | название, класс, тип (склад, производство, участок, площадка), входящие участки и здания, номер объекта CRM |
| `party` | Юридическое лицо | ИНН, название, группа компаний |
| `source` | Источник данных | имя, тип, условия использования, частота обновления, приоритет |
| `source_record` | Сырая запись источника, как пришла | источник, внешний номер, содержимое (JSON), геометрия или адрес, когда видели первый и последний раз |
| `link` | Связь между сущностями и с записью источника, «многие ко многим» | две стороны связи, статус (кандидат, подтверждена, отклонена), метод (документ, кадастровый номер, точка в участке, адрес, название, фото, вручную), охват (корпус, общий участок, площадка, часть участка), доказательства, кто и когда подтвердил или отозвал |
| `fact` | Одно утверждение об объекте | объект, поле, значение, запись-источник, дата, уверенность |
| crm\_card | Карточка HerzenCRM как есть: объект и его корпуса | номера CRM, адреса по ролям (гео, название, «для досок»), точка с пометкой «точка комплекса», сдаваемая площадь |
| review\_task | Задача ручной проверки | какого факта не хватает, кандидаты, противоречия, результат или причина исключения |

Собственник и арендатор — это факты с ролью, которые ссылаются на `party`. Уровень знания об объекте не хранится: он считается представлением (view) из фактов и привязок.

Три правила целостности:

- Сырую запись источника не правим и не удаляем. Ошибку исправляем новой привязкой или фактом «вручную».
- Ручной факт аналитика сильнее любого автоматического, пока его не отменит человек.
- Связь-кандидат не красит карту, а попадает в очередь на подтверждение. Отозванная связь остаётся в истории.

## Шкала «знаем / не знаем»

У каждого комплекса и участка один из пяти уровней. Уровень считается из фактов автоматически.

| Уровень | Цвет | Условие |
| --- | --- | --- |
| 0. Не знаем | Серый | Участок промназначения, о нём есть только кадастр |
| 1. Опознан | Синий | Известно, что это за объект: название или тип, площадь, класс — из внешнего источника |
| 2. Собственник известен | Жёлтый | Есть юрлицо-собственник, но объекта или контакта нет в CRM |
| 3. В базе | Зелёный | Объект в HerzenCRM, собственник и контакт занесены |
| Не наш профиль | Штриховка | Аналитик исключил: ТЭЦ, депо, режимный завод, очистные |

Три уточнения к шкале:

- **Покрытие считаем по площади зданий, а не по числу участков.** Иначе сотня гаражных участков перевесит один комплекс на 100 000 м². Счётчик: «зелёных м² / всех м² промназначения, кроме исключённых».
- **Отдельный счётчик для качественного.** Качественное — это класс A и B (решение руководителя 26.11.2026). Правило хранится настройкой и меняется без переделки. У серых участков класс неизвестен, поэтому счётчик качественного становится полным только после опознания (этап 2); до этого рядом с ним показана площадь зданий без класса. Первая цель — 100% зелёного по качественному.
- **Свежесть — отдельный признак.** Зелёный объект, который в CRM не трогали дольше 12 месяцев, получает метку «проверить». Цвет не меняется.

В паспорте объекта тот же принцип виден по полям: восемь строк (тип, площадь, класс, фото, собственник, контакт, арендаторы, что в рынке), у каждой — значение с источником и датой или пометка «не знаем».

Цвет — это представление из независимых признаков: «здание опознано», «собственник известен», «объект в CRM», «контакт занесён», «связь с участком подтверждена». Один признак не включает другой. Зелёным участок становится только при подтверждённой связи с объектом CRM. Связь-кандидат рисуется пунктирным контуром и в счётчик покрытия не входит. Связь уровня «площадка» красит только ту часть участка, которую площадка занимает.

## MVP

MVP отвечает на один вопрос: какая доля индустриальной недвижимости региона у нас в базе и что именно не закрыто. Срок — 4–6 недель.

Что входит:

1. База PostGIS со схемой из раздела «Модель данных». Черновик SQL — во вкладке «Стартовый набор».
2. Загрузка участков и зданий промназначения по Москве и области, расчёт маски.
3. Импорт ночного снимка CRM: объекты, корпуса и блоки с точками. Черновик границы объекта строится по точкам корпусов, точка объекта в расчёте не участвует.
4. Режим «граница объекта»: включить или исключить участок, кнопка «Граница верна», журнал правок. Подтвердить может любой сотрудник.
5. Веб-карта: слои, окраска по шкале, паспорт по клику, фильтры по уровню, площади и району, счётчики покрытия и разметки. Карта и паспорт читаются с телефона.
6. Две очереди с выгрузкой в Excel: серые участки по площади зданий и объекты CRM без подтверждённой границы.
7. Вход по рабочей учётке, одна роль для всех.
8. Подключение QGIS к базе для аналитиков.

Чего в MVP нет: каталога ЦИАН и M2Data, выписок ЕГРН, арендаторов, разных ролей доступа, отдельного мобильного приложения, правки фактов на карте (кроме границ объектов).

**Кто пользуется первой версией** (руководитель, 26.11.2026): все сотрудники, кто захочет, — брокеры и аналитики. Следствия для MVP:

- Вход по рабочей учётке нужен с первого дня. Внешним людям и клиентам карта не открывается.
- Роль одна для всех: смотреть карту и паспорта, размечать границы, подтверждать связи. Каждое изменение записывается с именем и временем, другой человек может исправить.
- Карта и паспорт читаются с телефона: брокер открывает их на объекте. Разметка границ — с компьютера. Это предложение, не решение.
- Интерфейс понятен без обучения: брокер не знает слов «слой» и «связь-кандидат». QGIS остаётся инструментом аналитиков.

Критерии приёмки:

- [ ] Отчёт среза даёт две отдельные метрики. Первая — доля карточек CRM, получивших статус связи с участком: подтверждена, кандидат или нет, с причиной. Вторая — точность подтверждённых связей на контрольной выборке, проверенной вручную. Метрики не складываются в одно число, целевые значения задаются после среза.
- [ ] Счётчик покрытия на карте совпадает с контрольным SQL-запросом.
- [ ] Карта региона открывается быстрее 3 секунд, паспорт по клику — быстрее 1 секунды.
- [ ] Тестовый источник (CSV с точками и полями) подключается за один день без изменения схемы.
- [ ] На карте и в выгрузках нет телефонов, почт и имён из CRM.
- [ ] руководитель и аналитик за 15 минут без подсказок находят пять крупнейших серых участков в выбранном районе.

Плюс восемь проверок на эталоне пилота (Ерино, Немчиновка, Плещеевская, Бережки и другие) — во вкладке [Приложение: пилот](#appendix).

**Первая неделя — вертикальный срез на одном районе.** Берём один городской округ с плотной складской застройкой, проходим весь путь от кадастра до окрашенной карты. Срез покажет главные неизвестные: насколько полно НСПД отдаёт границы, сколько объектов CRM ложится на участки автоматически, годится ли вид использования как маска.

## Этапы до Final Point

Каждый этап переводит объекты на следующий уровень шкалы и даёт пользу сам по себе. Дорожная карта нарисована в визуальном приложении.

1. **Основа и наша база (MVP, 4–6 недель).** Кадастр, маска, CRM, счётчик покрытия. Результат: видно серое и зелёное.
2. **Опознание.** Каталог ЦИАН, M2Data и объявления площадок. Серые участки получают название, класс, фото и становятся синими. Результат: список «качественное, но не в базе».
3. **Собственники.** Выписки ЕГРН по приоритетным синим участкам, ЕГРЮЛ по ИНН. Задачи аналитикам «закрой участок» с карты уходят в WEEEK. Результат: синее становится жёлтым и зелёным.
4. **Арендаторы и конкуренты.** Организации на картах, фиды агентств. Результат: по зданию видно, кто в нём сидит и кто его продаёт.
5. **Будущее предложение.** Разрешения на строительство, ГПЗУ, инвесткарта области, пресс-релизы. Сюда же — полный перечень разрешённого использования по ПЗЗ: метод отработан пилотом на 19 карточках из 30. Результат: объект появляется на карте до того, как он построен, и по участку видно, что на нём можно строить.
6. **ИИ-обогащение.** Агент берёт серый участок, сам собирает о нём факты из подключённых источников и приносит аналитику на подтверждение.

После этапа 3 система выполняет исходную задачу для качественной недвижимости. Этапы 4–6 можно менять местами по потребности бизнеса.

## Стек и размещение

Все детали открытые, зрелые и заменяемые. Своего кода — адаптеры, сопоставление и одна страница карты.

| Слой | Деталь | Зачем | Чем заменить |
| --- | --- | --- | --- |
| Хранение | PostgreSQL с PostGIS | Геометрия, пространственные запросы, представления покрытия | — |
| Плитки | [Martin](https://github.com/maplibre/martin) | Отдаёт таблицы PostGIS векторными плитками без кода | pg\_tileserv, PMTiles |
| Карта | MapLibre GL JS | Быстрая векторная карта в браузере, окраска по правилам | Leaflet, deck.gl |
| Подложка | Плитки OpenStreetMap, спутник | Фон | Яндекс Карты по лицензии |
| Адаптеры и сопоставление | Python | На нём написан коллектор НСПД из пилота; лучшие библиотеки для геоданных | — |
| Рабочее место аналитика | QGIS | Правка геометрии, сложные выборки, печать | — |
| Паспорт и списки | Лёгкий веб-сервис поверх базы | Клик по участку, фильтры, выгрузка | — |

Размещение: отдельная Linux-машина, где именно — решает команда CTO. Оценка: 4 ядра, 16 ГБ памяти, 100 ГБ диска — приблизительная, уточняется после вертикального среза. Доступ изнутри корпоративной сети; вход по рабочей учётке. Любая сетевая настройка — тикетом администратору.

Дизайн экрана выбирает команда CTO и фиксирует его переменными до начала вёрстки. У шкалы знания пять цветов, уровень всегда дублируется словом.

## Риски

Главный риск — не код, а доступ к данным и право их хранить.

| Риск | Что делаем |
| --- | --- |
| У НСПД нет официального API. Открытые библиотеки ходят по недокументированным адресам, они меняются без предупреждения | Грузим один раз и храним у себя, обновляем раз в квартал, с паузами. Запасной путь — платный поставщик кадастровых данных по договору |
| Вид использования в кадастре неточен: склады стоят на землях населённых пунктов и сельхозназначения | Маска из трёх признаков: кадастр, OSM, крупное здание на участке. Плюс ручное добавление и каждый объект CRM считается промназначением |
| Данные Яндекс Карт нельзя сохранять без коммерческой лицензии | Яндекс — только подложка. Слой арендаторов — после проверки лицензии |
| ЦИАН закрывает страницы от сервера проверкой «я не робот» (с 20.11.2026); условия M2Data не проверены | Берём через существующий снимок и по договорённости. Защиту не обходим |
| Комплекс не равен участку: несколько участков, несколько владельцев | Сущность `site` и ручное подтверждение спорных привязок |
| Персональные данные | В реестре только юрлица. Контакты людей остаются в CRM |
| Нагрузка на CRM | Только ночной снимок, без перебора объектов |
| Система превращается в тяжёлую ГИС | На каждом этапе один вопрос бизнеса и один счётчик. Всё сложное аналитик делает в QGIS |

Три риска, которые показал пилот:

- **Ложная точность привязки.** Из 30 карточек конкретная земля установлена для 13, ещё 9 привязаны только к общей площадке, остальные не решены или исключены. Автоматическая окраска по точке дала бы красивую, но неверную карту. Защита — статус кандидата и очередь подтверждения.
- **Актуальность ПЗЗ не проверяется машиной.** Карты новых редакций бывают нечитаемыми сканами, муниципальные архивы отвечают отказом, файл в папке 2026 года содержит карту 2024–2025. Ранний положительный вывод по площадке Альфа был отозван на независимой проверке. Слой регламента требует ручной проверки редакции.
- **Сетевой доступ к госсистемам.** В пилоте НСПД отвечал только через российский выход в сеть, РГИС и ГИСОГД не отвечали вовсе. Маршруты пилота были настроены на личном компьютере и в систему не переносятся. Сборщикам нужна среда с выходом в сеть, согласованным с администратором.

</script><script type="text/markdown" id="md-starter"># Стартовый набор

Три вещи, с которыми команда начинает в первый день: схема базы, правила для ИИ-агентов репозитория и задачи на две недели. Схема и правила — черновики: команда копирует их в репозиторий и правит по итогам среза. Схема не запускалась на живой базе.

## Задачи на первые две недели

Неделя 1 — вертикальный срез на одном округе. Цель — ответить на три вопроса: насколько полно НСПД отдаёт границы, у какой доли объектов CRM собирается черновик границы, годится ли вид использования как маска.

- [ ] Выбрать округ: плотная складская застройка и не меньше 20 объектов CRM (руководитель).
- [ ] Поднять PostgreSQL с PostGIS и применить схему ниже.
- [ ] Адаптер НСПД: участки и здания округа, кеш ответов, не чаще запроса в секунду. Основа — коллектор пилота `nspd_collect.py`.
- [ ] Адаптер OpenStreetMap: контуры зданий и `landuse=industrial` округа.
- [ ] Адаптер снимка CRM: объекты, корпуса и блоки с точками и ролью точки. Снимки HerzenStats по ключу; доступ и формат — с ответственным за HerzenCRM.
- [ ] Черновики границ по точкам корпусов и соседи-кандидаты.
- [ ] Тесты на эталоне пилота (30 карточек): Ерино, Немчиновка, Плещеевская, Бережки.
- [ ] Отчёт среза на одну страницу и решение о сроке MVP.

Неделя 2 — карта, которой можно пользоваться на этом округе.

- [ ] Martin и MapLibre: слои участков, зданий, окраска по шкале.
- [ ] Паспорт по клику: поля с источником и датой или «не знаем».
- [ ] Режим границы: включить или исключить участок, «Граница верна», журнал правок.
- [ ] Счётчики покрытия и разметки, сверка с контрольным SQL-запросом.
- [ ] Вход по рабочей учётке.
- [ ] Показ руководителю и аналитику: за 15 минут без подсказок найти пять крупнейших серых участков и подтвердить одну границу.

## Схема базы

По разделу «Модель данных» ТЗ. Уровень знания и покрытие не хранятся, а считаются представлениями.

```sql
create extension if not exists postgis;

-- Источники и сырые записи: не правим и не удаляем
create table source (
  id serial primary key,
  name text unique not null,          -- nspd, osm, crm_snapshot, cian_offers ...
  terms text,                         -- условия использования и хранения
  refresh text,                       -- как часто обновляем
  priority int not null default 100   -- чей факт сильнее при споре
);

create table source_record (
  id bigserial primary key,
  source_id int not null references source,
  external_id text not null,
  payload jsonb not null,
  geom geometry(Geometry, 4326),
  address text,
  fetch_status text not null check (fetch_status in ('ok','timeout','denied','bad_format','empty')),
  first_seen timestamptz not null default now(),
  last_seen timestamptz not null default now(),
  unique (source_id, external_id)
);

-- Земля и здания: свой номер, кадастровый — внешний ключ с историей
create table parcel (
  id bigserial primary key,
  geom geometry(MultiPolygon, 4326) not null,
  geom_version int not null default 1,
  land_category text,
  permitted_use text,
  area_m2 numeric,
  is_industrial boolean,              -- null = не знаем
  retired_at timestamptz              -- участок разделили или объединили
);

create table cadnum (
  entity_type text not null check (entity_type in ('parcel','building')),
  entity_id bigint not null,
  cadnum text not null,
  valid_from date not null,
  valid_to date,
  primary key (entity_type, entity_id, cadnum, valid_from)
);

create table building (
  id bigserial primary key,
  geom geometry(MultiPolygon, 4326) not null,
  osm_id bigint,
  footprint_m2 numeric,               -- площадь пятна
  cadastral_m2 numeric,               -- кадастровая площадь, отдельно
  floors int
);

-- Комплекс, как его знает рынок, и его граница
create table site (
  id bigserial primary key,
  name text,
  kind text check (kind in ('warehouse','production','land','yard')),
  class text,                         -- A, B+, B, C; null = не знаем
  boundary geometry(MultiPolygon, 4326),
  boundary_status text not null default 'none'
    check (boundary_status in ('none','draft','confirmed','recheck')),
  excluded_reason text                -- «не наш профиль»: ТЭЦ, депо ...
);

create table party (
  id bigserial primary key,
  inn text unique,
  name text not null,
  group_name text
);

-- Карточка CRM как есть. Контактов людей здесь нет
create table crm_card (
  id bigserial primary key,
  crm_id text not null,
  kind text not null check (kind in ('object','corpus','block')),
  parent_crm_id text,
  addresses jsonb,                    -- адреса по ролям
  point geometry(Point, 4326),
  point_role text check (point_role in ('complex','corpus','block')),
  leasable_m2 numeric,
  owner_and_contact_filled boolean,   -- признак «зелёного», без самих контактов
  snapshot_date date not null,
  unique (crm_id, snapshot_date)
);

-- Связи «многие ко многим»: карту красит только confirmed
create table link (
  id bigserial primary key,
  from_type text not null, from_id bigint not null,
  to_type text not null,   to_id bigint not null,
  status text not null check (status in ('candidate','confirmed','rejected')),
  method text not null check (method in ('document','cadnum','point_in_parcel','address','name','photo','manual')),
  scope text check (scope in ('corpus','shared_parcel','site','part_of_parcel')),
  evidence jsonb,
  created_by text not null, created_at timestamptz not null default now(),
  decided_by text, decided_at timestamptz,
  revoked_by text, revoked_at timestamptz
);

-- Одно утверждение об объекте. Неизвестное — нет строки, а не ноль
create table fact (
  id bigserial primary key,
  entity_type text not null, entity_id bigint not null,
  field text not null,                -- area_m2, class, owner, tenant ...
  value jsonb not null,
  party_id bigint references party,   -- для собственника и арендатора
  source_record_id bigint references source_record,  -- null = вручную
  observed_at date,
  created_by text not null,
  created_at timestamptz not null default now(),
  revoked_at timestamptz
);

create table review_task (
  id bigserial primary key,
  entity_type text not null, entity_id bigint not null,
  missing text not null,              -- чего не хватает
  candidates jsonb,
  status text not null default 'open' check (status in ('open','done','excluded')),
  result text,
  closed_by text, closed_at timestamptz
);

create index on parcel using gist (geom);
create index on building using gist (geom);
create index on site using gist (boundary);
create index on crm_card using gist (point);
create index on link (from_type, from_id);
create index on link (to_type, to_id);
create index on fact (entity_type, entity_id, field);
```

## Правила для ИИ-агентов репозитория

Положить в корень репозитория как `AGENTS.md` (Claude Code читает его через `CLAUDE.md` со строкой `@AGENTS.md`). Собрано из правил, проверенных на прототипах, и уроков пилота.

```markdown
# Правила для агентов: Карта рынка HERZEN

Срез на <дата>. ТЗ: <ссылка>.

## Данные
- Автоматика создаёт только связи-кандидаты. confirmed ставит человек или документ (кадастровый номер из акта).
- Точка объекта CRM (point_role = complex) в расчёте границ не участвует. Граница строится по точкам корпусов и блоков.
- Неизвестное — null или нет строки, никогда не 0 и не «не найдено».
- Ошибка источника пишется в fetch_status: timeout, denied, bad_format, empty. Это не «объекта нет».
- source_record не правим и не удаляем. Ошибку исправляем новой связью или ручным фактом.
- Телефоны, почты и имена людей из CRM не храним, не логируем, не выводим. Только признак «контакт есть» и ссылка на карточку.

## Источники
- Источник подключается адаптером: он пишет только source_record. В site, link и fact пишет общий модуль сопоставления.
- НСПД: не чаще запроса в секунду, кеш ответов, остановка на ошибке доступа.
- HerzenCRM не опрашиваем напрямую и не пишем в неё. Читаем ночной снимок.
- Данные Яндекс Карт не сохраняем. Защиту площадок («я не робот», лимиты) не обходим.
- Новая библиотека или сервис — строка в docs/parts.md: что, зачем, чем заменить.

## Работа
- Сначала тест на эталоне пилота (tests/fixtures/pilot-30), потом код.
- Сеть, VPN, порты, доступы к госсистемам — только тикетом администратору. Обходных путей не ищем.
- Сбой, после которого что-то чинили, — запись в docs/incidents.md и правило из неё.
- Первая строка каждого документа — дата среза. Сверху — как сейчас, история — ниже.
- Цвета, шрифты и отступы — только из дизайн-кода проекта (design/tokens.css).
- KISS: на каждом этапе один вопрос бизнеса и один счётчик. Сложная аналитика — в QGIS, свой ГИС-редактор не пишем.
```
</script><script type="text/markdown" id="md-appendix"># Приложение: пилот обогащения

Отдельный исследовательский пилот в Codex (октябрь 2026) прошёл путь «карточка CRM → участок → зона → разрешённое использование» на 20 объектах (30 карточек корпусов и земли). Факты проверены на 20.10.2026 и позже не перепроверялись. Это эталонный набор для тестов и задел адаптера, а не работающая ГИС.

## Что сделано

| Статус | Что именно |
| --- | --- |
| Реализовано | Коллектор НСПД (`nspd_collect.py`): поиск по адресу и кадастровому номеру, кандидаты по точке, пересечение полного контура участка с зонами, кеш ответов с контрольной суммой, остановка на ошибках доступа |
| Реализовано | Полные перечни разрешённого использования по ПЗЗ для 19 карточек из 30: 1090 строк (919 основных и 171 условная, с повторами по карточкам), у каждой строки источник и точное место в нём: страница PDF или якорь HTML |
| Реализовано | Квалификация охвата: 8 карточек — конкретный участок, 2 — общий участок при неразличённых зданиях, 9 — общая площадка; 10 не решены, 1 исключена руководителем |
| Исследовано, не закрыто | Массовая выгрузка региона из НСПД, право долго хранить слои, полнота OSM и НСПД. РГИС Московской области и ГИСОГД Москвы подключить не удалось |
| Не делалось | Геобаза, карта, фоновый мониторинг, запись в CRM, установление собственников и контактов |

Выборка из 20 последних объектов не представляет рынок: по ней нельзя обещать ни долю автоматического закрытия, ни скорость покрытия региона.

## Проверки на эталоне (30 карточек, версия от 20.10.2026)

Эти проверки — часть приёмки MVP.

- [ ] Точка комплекса внутри участка создаёт кандидата. В тесте Ерино соседний участок не подтверждается.
- [ ] Найденный участок одного корпуса не переносится на остальные корпуса объекта.
- [ ] Связи уровня «площадка» и «общий участок» не увеличивают счётчик точных привязок корпусов.
- [ ] В Немчиновке окрашена только часть большого участка, занятая площадкой.
- [ ] Касание границ и пересечения с ничтожной площадью не создают связей (Плещеевская, Бережки).
- [ ] Неподтверждённое значение хранится как пусто, а не ноль. Альфа остаётся «не знаем».
- [ ] Тайм-аут, отказ в доступе, неожиданный формат и пустой ответ источника — четыре разных состояния; ни одно не превращается в «объект не найден».
- [ ] Импорт эталона сохраняет исходные номера CRM, адреса и порядок всех 30 карточек.

## Разрешённое использование по ПЗЗ (этап 5)

Полный перечень разрешённого использования (основные и условные виды) не получается одним запросом: НСПД отдаёт номер зоны, но не её действующий подтип и не текст регламента. Регламент берётся из принятого акта и его поправок, с проверкой даты содержания и территории. Один проверенный регламент переиспользуется для всех участков зоны.

Для этого слоя пилот предлагает ещё четыре таблицы: зона с версиями геометрии, редакция ПЗЗ, строка справочника ВРИ, применённый к карточке перечень. В MVP они не входят. Вид использования из кадастра и полный перечень по ПЗЗ — разные поля из разных источников.

## Пакет пилота

Пакет лежит у руководителя локально и передаётся команде CTO: три описания, коллектор НСПД, финальный JSON, таблица из 1090 строк, 30 компактных записей с раздельными полями для подтверждённых и кандидатных участков, карта 34 исходных материалов с контрольными суммами, примеры запросов и схема процесса пилота. Контактов, паролей и ключей в пакете нет.
